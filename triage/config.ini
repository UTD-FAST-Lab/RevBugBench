# Use absolute paths for this section.
[paths]
# Store raw data and intermediate results.
workDir = path/to/workDir
# Stores triage outputs.
outDir = path/to/outDir
# Path to FuzzBench root directory.
fuzzbenchDir = path/to/fuzzbench
# Path to FuzzBench experiment-data folder.
fuzzbenchExpDir = path/to/experiment-data
# List of Fuzzbench experiment names.
# A benchmark-fuzzer pair must only appear in one experiment.
# All fuzzers running a benchmark must only appear in the same experiment.
[experiments]
exp1
exp2
# RevBugBench benchmark names.
# RevbugBench currently supports the following 19 benchmarks.
[benchmarks]
file
libarchive
libgit2
libhtp
libxml2_reader
magma_libpng
magma_libsndfile
magma_libtiff_read_rgba
magma_libtiff_tiffcp
magma_libxml2_read_memory
magma_libxml2_xmllint
matio
ndpi
njs
stb
systemd
tpm2
usrsctp
zstd
# Fuzzer names.
[fuzzers]
afl
aflplusplus
eclipser
fairfuzz
libfuzzer
[values]
# The number of triage tasks to run in parellel.
cores = 4
# Time out of the fuzzing experiments in hours.
timeout = 24
# Number of trials of the fuzzing experiments.
# A warning will be given when any experiment has a different number of trials than specified.
trials = 3
